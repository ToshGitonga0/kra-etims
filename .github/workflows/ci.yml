name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Install, lint, typecheck, test, build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Verify KRA contract cross-references
        run: npm run verify-contracts

      # Unit tests only. Integration tests require real KRA sandbox
      # credentials and are intentionally NOT run here — see
      # .github/workflows/ and docs/sandbox.md. KRA_ETIMS_RUN_INTEGRATION is
      # left unset so tests/integration/* self-skip.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run
